name: Promote Green to Production

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1   # CloudFront is global

      - name: Switch CloudFront origin to GREEN
        run: |
          aws cloudfront get-distribution-config \
            --id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            > dist-config.json

          ETAG=$(jq -r '.ETag' dist-config.json)

          jq '
            .DistributionConfig.DefaultCacheBehavior.TargetOriginId="green-origin"
          ' dist-config.json > updated-config.json

          aws cloudfront update-distribution \
            --id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --if-match $ETAG \
            --distribution-config file://updated-config.json
