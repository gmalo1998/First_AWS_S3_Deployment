name: Promote Green to Production

on:
  workflow_dispatch:

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Switch CloudFront origin to GREEN
        run: |
          aws cloudfront get-distribution-config \
            --id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --query 'DistributionConfig' \
            > dist-config.json

          ETAG=$(aws cloudfront get-distribution-config \
            --id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --query 'ETag' \
            --output text)

          jq '
            .DefaultCacheBehavior.TargetOriginId = "react-green-bucket.s3.us-west-1.amazonaws.com"
          ' dist-config.json > updated-config.json

          aws cloudfront update-distribution \
            --id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --if-match "$ETAG" \
            --distribution-config file://updated-config.json
