name: Upload Website

on:
  push:
    branches:
    - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@master

    - name: NodeJs Setup
      uses: actions/setup-node@v1

      with:
        node-version: ${{secrets.NODE_VERSION}}
    - name: Install Dependencies
      uses: npm install
    - name: Build Project
      run: npm run build

    - name: configure AWS Credentials and Upload to S3
    - uses: aws-actions/configure-aws-credentials@v1
      with:
        AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_REGION: 'us-west-1'   # optional1: defaults to us-east-1
        SOURCE_DIR: 'public'      # optional2: defaults to entire repository
    - name: Deploy to S3
      run: aws s3 sync build s3://${{ secrets.AWS_S3_BUCKET }} --delete